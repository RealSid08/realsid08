<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sidhaarth Krishnan | Software Engineer</title>
    <meta name="description" content="Full-stack software engineer in Melbourne. Student visa with work rights. Available for full-time graduate employment from December 2026." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // The palette is role-based, not literal: "white" always means
              // foreground and "black" always means background, so flipping the
              // theme variables inverts every utility class on the site.
              white: 'rgb(var(--fg) / <alpha-value>)',
              black: 'rgb(var(--bg) / <alpha-value>)',
              gray: {
                100: 'rgb(var(--g100) / <alpha-value>)',
                200: 'rgb(var(--g200) / <alpha-value>)',
                300: 'rgb(var(--g300) / <alpha-value>)',
                400: 'rgb(var(--g400) / <alpha-value>)',
                500: 'rgb(var(--g500) / <alpha-value>)',
                600: 'rgb(var(--g600) / <alpha-value>)',
                700: 'rgb(var(--g700) / <alpha-value>)',
                800: 'rgb(var(--g800) / <alpha-value>)',
                900: 'rgb(var(--g900) / <alpha-value>)',
              },
              'mono-base': 'rgb(var(--bg) / <alpha-value>)',
              'mono-paper': 'rgb(var(--panel) / <alpha-value>)',
              'mono-light': 'rgb(var(--fg) / <alpha-value>)',
              'mono-glass': 'rgb(var(--fg) / 0.03)',
              'mono-border': 'rgb(var(--fg) / 0.1)',
              'mono-accent': 'rgb(var(--accent) / <alpha-value>)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
              display: ['Syne', 'Inter', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'appear': 'appear 1.5s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              appear: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Fira+Code:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
      /* Light is the default; dark is the override. */
      :root {
        --bg: 255 255 255;
        --panel: 246 247 249;
        --fg: 13 17 23;
        --accent: 29 78 216;
        --g100: 15 23 42;
        --g200: 30 41 59;
        --g300: 51 65 85;
        --g400: 71 85 105;
        --g500: 100 116 139;
        --g600: 148 163 184;
        --g700: 203 213 225;
        --g800: 226 232 240;
        --g900: 241 245 249;
        color-scheme: light;
      }

      html[data-theme='dark'] {
        --bg: 5 5 5;
        --panel: 10 10 10;
        --fg: 255 255 255;
        --accent: 229 229 229;
        --g100: 243 244 246;
        --g200: 229 231 235;
        --g300: 209 213 219;
        --g400: 156 163 175;
        --g500: 107 114 128;
        --g600: 75 85 99;
        --g700: 55 65 81;
        --g800: 31 41 55;
        --g900: 17 24 39;
        color-scheme: dark;
      }

      /* Diagram and canvas surfaces keep their own dark palette in both themes,
         so the line work stays legible without redrawing every visual. */
      .theme-dark {
        --bg: 5 5 5;
        --panel: 10 10 10;
        --fg: 255 255 255;
        --accent: 229 229 229;
        --g100: 243 244 246;
        --g200: 229 231 235;
        --g300: 209 213 219;
        --g400: 156 163 175;
        --g500: 107 114 128;
        --g600: 75 85 99;
        --g700: 55 65 81;
        --g800: 31 41 55;
        --g900: 17 24 39;
        color: rgb(var(--fg));
        color-scheme: dark;
      }

      /* Light mode is flat white by default, so cards get a soft lift. */
      html[data-theme='light'] .card-surface {
        box-shadow: 0 1px 2px rgba(13, 17, 23, 0.04), 0 18px 40px -32px rgba(13, 17, 23, 0.55);
      }

      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background-color: rgb(var(--bg));
        color: rgb(var(--fg));
        overflow-x: hidden;
        transition: background-color 300ms ease, color 300ms ease;
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        body { transition: none; }
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: rgb(var(--bg)); }
      ::-webkit-scrollbar-thumb { background: rgb(var(--fg) / 0.25); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgb(var(--fg) / 0.4); }
    </style>
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var forced = new URLSearchParams(location.search).get('theme');
          var stored = localStorage.getItem('theme');
          var theme =
            forced === 'light' || forced === 'dark'
              ? forced
              : stored === 'light' || stored === 'dark'
                ? stored
                : 'light';
          if (forced === 'light' || forced === 'dark') {
            localStorage.setItem('theme', forced);
          }
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
